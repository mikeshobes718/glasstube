name: GlassTube
options:
  bundleIdPrefix: com.mikeshobes
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: N7LRRN2YGY
targets:
  GlassTube:
    type: application
    platform: iOS
    sources:
      - path: GlassTube
    dependencies:
      - target: GlassTubeShare
    info:
      path: GlassTube/Info.plist
      properties:
        CFBundleDisplayName: GlassTube
        CFBundleShortVersionString: "2.2"
        CFBundleVersion: "35"
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: GlassTube sends the video from this phone to the glasses on your WiFi.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.mikeshobes.glasstube
            CFBundleURLSchemes:
              - glasstube
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikeshobes.glasstube
        PRODUCT_NAME: GlassTube
        DEVELOPMENT_TEAM: N7LRRN2YGY
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: 35
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
  GlassTubeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: GlassTubeShare
    info:
      path: GlassTubeShare/Info.plist
      properties:
        CFBundleDisplayName: GlassTube
        CFBundleShortVersionString: "2.2"
        CFBundleVersion: "35"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikeshobes.glasstube.share
        PRODUCT_NAME: GlassTubeShare
        DEVELOPMENT_TEAM: N7LRRN2YGY
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: 35
        GENERATE_INFOPLIST_FILE: NO
