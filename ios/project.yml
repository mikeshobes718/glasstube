name: GlassTube
options:
  bundleIdPrefix: com.mikeshobes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: N7LRRN2YGY
targets:
  GlassTube:
    type: application
    platform: iOS
    sources:
      - path: GlassTube
    info:
      path: GlassTube/Info.plist
      properties:
        CFBundleDisplayName: GlassTube
        CFBundleShortVersionString: "1.24"
        CFBundleVersion: "25"
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: GlassTube sends the video from this phone to the glasses on your WiFi.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.mikeshobes.glasstube
            CFBundleURLSchemes:
              - glasstube
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikeshobes.glasstube
        PRODUCT_NAME: GlassTube
        DEVELOPMENT_TEAM: N7LRRN2YGY
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.24"
        CURRENT_PROJECT_VERSION: 25
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
